<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07162B"/><stop offset="1" stop-color="#0F2D52"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00C27A" stop-opacity=".45"/><stop offset="1" stop-color="#00C27A" stop-opacity="0"/></linearGradient>
<linearGradient id="line" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#00C27A"/><stop offset="1" stop-color="#7DFFC4"/></linearGradient>
<radialGradient id="floor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00C27A" stop-opacity=".55"/><stop offset="1" stop-color="#00C27A" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<!-- skyline -->
<g fill="#0A2142" opacity=".9">
<rect x="0" y="420" width="70" height="200"/><rect x="80" y="360" width="50" height="260"/><rect x="140" y="440" width="90" height="180"/>
<rect x="1050" y="400" width="80" height="220"/><rect x="1140" y="340" width="55" height="280"/><rect x="1205" y="430" width="75" height="190"/>
</g>
<!-- circuit lines -->
<g stroke="#00C27A" stroke-opacity=".35" stroke-width="2" fill="none">
<path d="M40 120 H140 V180 H220"/><path d="M40 200 H100 V260"/><path d="M1240 120 H1140 V180 H1060"/><path d="M1240 220 H1180 V290"/>
</g>
<g fill="#00C27A" fill-opacity=".6"><circle cx="220" cy="180" r="5"/><circle cx="100" cy="260" r="5"/><circle cx="1060" cy="180" r="5"/><circle cx="1180" cy="290" r="5"/></g>
<!-- holo panel -->
<g filter="url(#glow)"><rect x="210" y="70" width="860" height="470" rx="18" fill="#0B2547" fill-opacity=".55" stroke="#00C27A" stroke-width="3"/></g>
<g stroke="#5CF2B0" stroke-opacity=".15" stroke-width="1.5">
<path d="M250 150H1030M250 230H1030M250 310H1030M250 390H1030M250 470H1030"/><path d="M330 100V510M450 100V510M570 100V510M690 100V510M810 100V510M930 100V510"/>
</g>
<path d="M260 480 L360 440 L450 460 L550 380 L640 400 L740 300 L830 330 L930 200 L1000 150 L1000 520 L260 520 Z" fill="url(#area)"/>
<g filter="url(#glow)"><polyline points="260,480 360,440 450,460 550,380 640,400 740,300 830,330 930,200 1000,150" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1022,128 982,134 1010,170" fill="#7DFFC4"/></g>
<g fill="#0B2547" stroke="#7DFFC4" stroke-width="4"><circle cx="450" cy="460" r="8"/><circle cx="640" cy="400" r="8"/><circle cx="830" cy="330" r="8"/></g>
<!-- floor glow -->
<ellipse cx="640" cy="632" rx="260" ry="34" fill="url(#floor)"/>
<ellipse cx="640" cy="632" rx="150" ry="16" fill="none" stroke="#7DFFC4" stroke-opacity=".7" stroke-width="2"/>
<!-- person from behind -->
<g fill="#050E1C" stroke="#00C27A" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round">
<path d="M606 470 L600 628 Q600 636 610 636 L632 636 Q638 636 638 628 L640 500 L642 628 Q642 636 648 636 L670 636 Q680 636 680 628 L674 470 Z"/>
<path d="M584 368 Q586 350 612 346 L668 346 Q694 350 696 368 L702 482 Q700 492 690 492 L590 492 Q580 492 578 482 Z"/>
<path d="M586 372 Q566 384 562 430 L556 500 Q556 510 566 510 L578 510 Q586 508 588 498 L598 420 Z"/>
<path d="M694 372 Q714 384 718 430 L724 500 Q724 510 714 510 L702 510 Q694 508 692 498 L682 420 Z"/>
<path d="M630 330 L650 330 L654 350 L640 362 L626 350 Z"/>
<ellipse cx="640" cy="312" rx="25" ry="29"/>
<path d="M640 362 L640 490" fill="none" stroke-opacity=".35"/>
</g>
</svg>
