<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fff"><div id="root" style="width:1280px;height:720px"></div>
<script>
const INK = "#1a1a1a", F = 'Arial,"Liberation Sans",Helvetica,sans-serif', D2R = Math.PI / 180, TL = window.TL, G = TL.ground;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = u => u * u * (3 - 2 * u);
const backE = (u, c1 = .9) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const easeOutBounce = u => { const n = 7.5625, d = 2.75; if (u < 1 / d) return n * u * u; if (u < 2 / d) { u -= 1.5 / d; return n * u * u + .75; } if (u < 2.5 / d) { u -= 2.25 / d; return n * u * u + .9375; } u -= 2.625 / d; return n * u * u + .984375; };
const easeOutBack = u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const ctx = document.createElement('canvas').getContext('2d');
const measure = (s, size) => { ctx.font = `800 ${size}px ${F}`; return ctx.measureText(s).width; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

// ---------------- thư viện tư thế (độ; 0 = thẳng xuống, + = hướng về phía trước) ----------------
const POSE = {
  idle:    { lean: 2, head: 0, uaL: 8, faL: 18, uaR: -6, faR: 10, thL: 7, shL: 2, thR: -7, shR: -2 },
  phone:   { lean: 6, head: 16, uaL: 6, faL: 16, uaR: 38, faR: 112, thL: 3, shL: 1, thR: -3, shR: -1 },
  startle: { lean: -16, head: -10, uaL: 140, faL: 165, uaR: 150, faR: 172, thL: 16, shL: -8, thR: -10, shR: -28 },
  think:   { lean: 3, head: 6, uaL: 6, faL: 16, uaR: 62, faR: 196, thL: 3, shL: 1, thR: -3, shR: -1 },
  scratch: { lean: 2, head: 4, uaL: 6, faL: 16, uaR: 112, faR: 205, thL: 3, shL: 1, thR: -3, shR: -1 },
  shrug:   { lean: -2, head: 12, uaL: 35, faL: 100, uaR: 35, faR: 100, thL: 3, shL: 1, thR: -3, shR: -1 },
  point:   { lean: 5, head: 0, uaL: 6, faL: 16, uaR: 82, faR: 90, thL: 6, shL: 3, thR: -6, shR: -3 },
  pointUp: { lean: 2, head: -8, uaL: 6, faL: 16, uaR: 128, faR: 136, thL: 3, shL: 1, thR: -3, shR: -1 },
  explain: { lean: 3, head: 4, uaL: 40, faL: 80, uaR: 52, faR: 86, thL: 4, shL: 2, thR: -4, shR: -2 },
  tip:     { lean: 0, head: 2, uaL: 6, faL: 16, uaR: 150, faR: 172, thL: 3, shL: 1, thR: -3, shR: -1 },
  squat:   { lean: 26, head: -12, uaL: 24, faL: 12, uaR: 40, faR: 16, thL: 68, shL: -12, thR: 60, shR: -18 },
  crouch:  { lean: 18, head: -6, uaL: -30, faL: -10, uaR: -22, faR: -4, thL: 40, shL: -24, thR: 36, shR: -30 },
  cheer:   { lean: -6, head: -10, uaL: 160, faL: 178, uaR: 150, faR: 175, thL: 8, shL: -4, thR: -4, shR: -12 },
  air:     { lean: -4, head: -8, uaL: 150, faL: 170, uaR: 160, faR: 178, thL: 26, shL: -34, thR: 10, shR: -40 },
  stern:   { lean: 0, head: 0, uaL: 4, faL: 12, uaR: -2, faR: 8, thL: 2, shL: 0, thR: -2, shR: 0 }
};
const mix = (a, b, u) => { const o = {}; for (const k in a) o[k] = lerp(a[k], b[k], u); return o; };
function poseTrack(t, keys) {
  let i = 0; while (i + 1 < keys.length && t >= keys[i + 1][0]) i++;
  const cur = POSE[keys[i][1]], prev = POSE[keys[Math.max(0, i - 1)][1]];
  const dur = keys[i][2] || .34, u = i === 0 ? 1 : clamp((t - keys[i][0]) / dur);
  return mix(prev, cur, keys[i][3] === 'soft' ? smooth(u) : backE(u, .7));
}
function walkPose(ph, amp, run) {
  const sL = Math.sin(ph), sR = Math.sin(ph + Math.PI), cL = Math.cos(ph), cR = Math.cos(ph + Math.PI);
  const bend = (c) => 8 + (run ? 62 : 40) * Math.max(0, c);
  const thL = amp * sL, thR = amp * sR;
  const arm = (run ? 1.25 : .85) * amp;
  return { lean: run ? 15 : 5, head: run ? -6 : 0, thL, shL: thL - bend(cL), thR, shR: thR - bend(cR),
    uaL: -arm * sL * .9 + 4, faL: -arm * sL * .9 + 4 + (run ? 78 : 26), uaR: arm * sL * .9 + 4, faR: arm * sL * .9 + 4 + (run ? 78 : 26) };
}
function track(keys, t) { // [[t,v,ease?],...] -> nội suy mượt
  if (t <= keys[0][0]) return keys[0][1]; let i = 0; while (i + 1 < keys.length && t >= keys[i + 1][0]) i++;
  if (i === keys.length - 1) return keys[i][1]; const [t0, v0] = keys[i], [t1, v1] = keys[i + 1], u = clamp((t - t0) / (t1 - t0));
  return lerp(v0, v1, keys[i][2] === 'lin' ? u : smooth(u));
}

Object.assign(POSE, {

const blink = (t, ph) => ((t + ph) % 3.6) < .13;
const caps = TL.captions;
const L = id => TL.scenes[id];
const capsOf = id => caps.filter(c => c.s >= L(id).s - .01 && c.s < L(id).e - .01).map(c => c.s - L(id).s);
const cs = {}; TL.order.forEach(id => cs[id] = capsOf(id)); const cs_t = (id, k) => cs[id][k];
const pop = (r, r0, d = .35) => r < r0 ? 0 : easeOutBack(clamp((r - r0) / d));
const fade = (r, r0, r1) => clamp((r - r0) / (r1 - r0));
const f1 = v => v.toFixed(1);

// ---------------- biểu tượng nhỏ (gốc ở tâm) ----------------

  coin: (t = '$') => `<circle r="20" fill="#f2c14e" stroke="${INK}" stroke-width="3"/><text y="8" font-family='${F}' font-size="22" font-weight="800" text-anchor="middle" fill="${INK}">${t}</text>`,
  cup: (c = '#d9a066') => `<path d="M-16 -16 L16 -16 L12 22 L-12 22Z" fill="${c}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><rect x="-18" y="-22" width="36" height="8" rx="3" fill="#fff" stroke="${INK}" stroke-width="3"/><path d="M4 -22 L10 -40" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><g fill="${INK}"><circle cx="-5" cy="15" r="2.4"/><circle cx="2" cy="16" r="2.4"/><circle cx="7" cy="14" r="2.4"/><circle cx="-1" cy="10" r="2.4"/></g>`,
  case: () => `<rect x="-22" y="-14" width="44" height="32" rx="5" fill="#c9783a" stroke="${INK}" stroke-width="3"/><path d="M-8 -14 V-22 H8 V-14" fill="none" stroke="${INK}" stroke-width="3"/><path d="M-22 0 H22" stroke="${INK}" stroke-width="2.4"/>`,
  brief: () => `<rect x="-24" y="-14" width="48" height="34" rx="5" fill="#8a6a4a" stroke="${INK}" stroke-width="3"/><path d="M-9 -14 V-22 H9 V-14" fill="none" stroke="${INK}" stroke-width="3"/><path d="M-24 2 H24" stroke="${INK}" stroke-width="2.4"/>`,

  build: () => `<rect x="-24" y="-34" width="48" height="68" fill="#6c8aa6" stroke="${INK}" stroke-width="3"/>` + [-14, 2].map(x => [-24, -8, 8].map(y => `<rect x="${x}" y="${y}" width="10" height="10" fill="#f6e27a"/>`).join('')).join(''),
  chat: (c = '#fff') => `<path d="M-24 -18 H24 Q30 -18 30 -12 V10 Q30 16 24 16 H0 L-12 28 L-10 16 H-24 Q-30 16 -30 10 V-12 Q-30 -18 -24 -18Z" fill="${c}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><g fill="${INK}"><circle cx="-12" cy="-1" r="3.4"/><circle cx="0" cy="-1" r="3.4"/><circle cx="12" cy="-1" r="3.4"/></g>`,
  head: (g = false) => `<circle r="16" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="-5" cy="-2" r="2.4" fill="${INK}"/><circle cx="6" cy="-2" r="2.4" fill="${INK}"/><path d="M-6 6 Q0 11 7 6" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>${g ? `<circle cx="-5" cy="-2" r="6" fill="none" stroke="${INK}" stroke-width="2"/><circle cx="6" cy="-2" r="6" fill="none" stroke="${INK}" stroke-width="2"/>` : ''}`,
  plane: () => `<path d="M-30 0 L10 -4 L-10 -22 L0 -22 L28 -6 L40 -6 Q46 0 40 6 L28 6 L0 22 L-10 22 L10 4 L-30 0Z" fill="#fff" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`,
  snack: () => `<path d="M-16 -22 L16 -22 L20 22 L-20 22Z" fill="#e0566b" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M-16 -22 L-12 -28 L-6 -22 L0 -28 L6 -22 L12 -28 L16 -22" fill="none" stroke="${INK}" stroke-width="3"/><circle cy="2" r="8" fill="#f6e27a" stroke="${INK}" stroke-width="2.4"/>`,
  phone: () => `<rect x="-14" y="-24" width="28" height="48" rx="5" fill="#222"/><rect x="-11" y="-19" width="22" height="36" fill="#7fd6a8"/>`
};
const ico = (n, x, y, s = 1, rot = 0, a = 1, arg) => a <= 0 ? '' : `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${rot}) scale(${s})" opacity="${a}">${ICO[n](arg)}</g>`;
function bubble(cx, cy, w, h, s, inner, tail = [cx - w * .15, cy + h / 2 + 60], th = true) { // bong bóng suy nghĩ
  if (s <= 0) return '';
  const dots = th ? [[.15, .55, 9], [.5, .8, 6]].map(([u, v, r]) => { const x = lerp(tail[0], cx, u * .25 + .5 - .5 * 0), y = lerp(cy + h / 2, tail[1], 1 - v); return ''; }).join('') : '';
  const tx = lerp(cx - w * .15, tail[0], 1), ty0 = cy + h / 2, sd = [[tail[0], tail[1], 6], [lerp(tail[0], cx, .35), lerp(tail[1], ty0, .55), 10], [lerp(tail[0], cx, .6), lerp(tail[1], ty0, .22), 14]];
  return `<g transform="translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})">${sd.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="3"/>`).join('')}<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="${Math.min(h / 2, 40)}" fill="#fff" stroke="${INK}" stroke-width="3.6"/>${inner}</g>`;
}
const txt = (s, x, y, size, fill = INK, anchor = 'middle', extra = '') => `<text x="${x}" y="${y}" font-family='${F}' font-size="${size}" font-weight="800" text-anchor="${anchor}" fill="${fill}" ${extra}>${s}</text>`;

// ---------------- phông nền ----------------
function office(t, o = {}) {

  const cx = 640, cy = 120, hr = o.clockH ?? 10, mn = o.clockM ?? 10, ang = o.spin ? t * o.spin : null;
  const ha = ang != null ? ang / 12 : (hr % 12 + mn / 60) * 30, ma = ang != null ? ang : mn * 6;

  b += `<g transform="translate(1100 120)"><rect x="-70" y="-50" width="140" height="100" fill="#fff" stroke="#8aa0b4" stroke-width="6"/><polyline points="-50,30 -20,-5 5,10 45,-30" fill="none" stroke="#7fb28a" stroke-width="6"/></g>`;
  b += `<g transform="translate(1210 552)"><rect x="-22" y="-44" width="44" height="44" fill="#a8664a"/><ellipse cy="-52" rx="30" ry="22" fill="#4f9a62"/><ellipse cx="-14" cy="-70" rx="16" ry="22" fill="#3f8a52"/></g>`;

  return b;
}

// ---------------- kịch bản từng cảnh ----------------
// c[i]: nhân vật i (0 bạn-có chỏm tóc, 1 kính, 2 tóc đuôi ngựa, 3 cao). Thời gian r = giây tính từ đầu cảnh.
const W = (a, b, r0, r1) => [[r0, a, 'lin'], [r1, b]];
const SCN = {
  office: {
    bg: (t, r) => office(t, { spin: r > cs.office[2] ? 900 : 0, clockH: 10, clockM: 10 }),
    c: [
      { x: [[0, 200]], poses: [[0, 'type'], [cs_t('office', 1), 'slump', .5, 'soft']], expr: [[0, 'neutral'], [cs_t('office', 1), 'worry']] },
      { x: [[0, 480]], poses: [[0, 'type'], [1.5, 'scratch', .4], [2.6, 'type', .4, 'soft']], expr: [[0, 'neutral']] },
      { x: [[0, 760]], poses: [[0, 'type']], expr: [[0, 'neutral'], [cs_t('office', 1) + 1, 'worry']] },

// ---------------- âm thanh theo cảnh ----------------

window.stepTimes = () => { const out = [];
